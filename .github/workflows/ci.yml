name: 🛡️ CI Pipeline — IncidentAI

on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pr-lint:
    name: 🔍 Validate PR & Branch
    uses: yuvadevlab/.github/.github/workflows/reusable-pr-lint.yml@main

  validate-and-build:
    name: 🏗️ CI Validation & Build
    uses: yuvadevlab/.github/.github/workflows/reusable-ci.yml@main
    with:
      node-version: "22"
      run-tests: true
